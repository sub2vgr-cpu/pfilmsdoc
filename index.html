<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Documentation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
display:flex;
background:#f5f7fb;
color:#222;
}

/* Sidebar */

.sidebar{
width:260px;
height:100vh;
background:white;
border-right:1px solid #ddd;
position:fixed;
left:0;
top:0;
padding:25px;
display:flex;
flex-direction:column;
}

.logo{
display:flex;
align-items:center;
gap:12px;
margin-bottom:30px;
}

.logo img{
width:45px;
height:45px;
border-radius:10px;
}

.logo h2{
font-size:20px;
}

nav{
display:flex;
flex-direction:column;
gap:8px;
}

nav a{
text-decoration:none;
color:#444;
padding:12px;
border-radius:10px;
transition:.2s;
font-weight:500;
}

nav a:hover{
background:#eef4ff;
color:#2563eb;
}

.bottom{
margin-top:auto;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2563eb;
color:white;
font-weight:600;
}

/* Main */

.main{
margin-left:260px;
width:calc(100% - 260px);
}

/* Header */

.header{
height:75px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
}

.search{
width:320px;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
}

/* Hero */

.hero{
padding:60px;
}

.hero h1{
font-size:48px;
margin-bottom:20px;
}

.hero p{
font-size:18px;
color:#666;
max-width:700px;
line-height:1.7;
margin-bottom:35px;
}

.hero-image{

height:350px;

background:#dbeafe;

border-radius:20px;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

color:#2563eb;

font-weight:700;

margin-bottom:40px;

}

.cta{

display:inline-block;

background:#2563eb;

color:white;

padding:15px 30px;

border-radius:12px;

text-decoration:none;

font-weight:600;

}

/* Footer */

footer{

padding:30px;

text-align:center;

color:#777;

}

.dark{

background:#111827;

color:white;

}

.dark .sidebar,

.dark .header{

background:#1f2937;

border-color:#374151;

}

.dark nav a{

color:#ddd;

}

.dark nav a:hover{

background:#374151;

}

.dark .search{

background:#374151;

border:none;

color:white;

}

.dark .hero-image{

background:#374151;

color:white;

}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">

<img src="logo.png">

<h2>Docs</h2>

</div>

<nav>

<a href="index.html">🏠 Home</a>

<a href="introduction.html">📘 Introduction</a>

<a href="#">📷 Images</a>

<a href="#">🎥 Videos</a>

</nav>

<div class="bottom">

<button onclick="darkMode()">🌙 Dark Mode</button>

</div>

</div>

<!-- Main -->

<div class="main">

<header class="header">

<h3>Documentation</h3>

<input class="search" placeholder="Search Documentation...">

</header>

<section class="hero">

<h1>Welcome 👋</h1>

<p>

Welcome to our documentation website.

Here you'll find everything you need to understand and use the project.

</p>

<div class="hero-image">

Hero Image

</div>

<a class="cta" href="introduction.html">

📘 Read Introduction

</a>

</section>

<footer>

© 2026 Documentation Website

</footer>

</div>

<script>

function darkMode(){

document.body.classList.toggle("dark");

}

</script>

</body>

</html>
